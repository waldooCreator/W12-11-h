# SonarCloud Configuration
# https://sonarcloud.io

# Configuración del proyecto
# NOTA: Reemplazar estos valores con los de tu proyecto en SonarCloud
sonar.projectKey=waldooCreator_W12-11-h
sonar.organization=waldoocreator

# Nombre y versión del proyecto
sonar.projectName=Cypress Real World App - CI/CD Workshop
sonar.projectVersion=1.0.0

# Rutas de código fuente
sonar.sources=src,backend
sonar.tests=src/__tests__,cypress/tests

# Exclusiones
sonar.exclusions=**/*.spec.ts,**/*.spec.js,**/*.test.ts,**/*.test.js,**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/*.cy.tsx,**/*.cy.ts

# Exclusiones de cobertura
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.js,**/*.test.ts,**/*.test.js,**/*.cy.tsx,**/*.cy.ts,**/cypress/**,**/scripts/**

# TypeScript configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# JavaScript/TypeScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8

# Links
sonar.links.homepage=https://github.com/waldooCreator/W12-11-h
sonar.links.ci=https://github.com/waldooCreator/W12-11-h/actions
sonar.links.issue=https://github.com/waldooCreator/W12-11-h/issues
